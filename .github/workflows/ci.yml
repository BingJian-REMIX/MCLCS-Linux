name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build MCLCS-Linux.sln -c Release

      - name: Test
        run: dotnet test tests/MCLCS.Linux.Tests/MCLCS.Linux.Tests.csproj -c Release --no-build

      - name: CLI smoke
        run: |
          dotnet run --project tools/MCLCS.Linux.Cli -c Release --no-build -- version
          dotnet run --project tools/MCLCS.Linux.Cli -c Release --no-build -- tabs
